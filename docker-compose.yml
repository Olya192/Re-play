services:
  client:
    container_name: prakticum-client
    image: prakticum-client
    depends_on:
      server:
        condition: service_healthy
    build:
      context: .
      dockerfile: Dockerfile.client
      args:
        EXTERNAL_SERVER_URL: ${EXTERNAL_SERVER_URL}
        INTERNAL_SERVER_URL: ${INTERNAL_SERVER_URL}
    restart: always
    ports:
      - "${CLIENT_PORT}:80"
    environment:
      PORT: 80
      NODE_ENV: production

  server:
    container_name: prakticum-server
    image: prakticum-server
    depends_on:
      postgres:
        condition: service_healthy
    build:
      context: .
      dockerfile: Dockerfile.server
      args:
        SERVER_PORT: ${SERVER_PORT}
    env_file:
      - .env
    restart: always
    ports:
      - "${SERVER_PORT}:${SERVER_PORT}"
    environment:
      SERVER_PORT: ${SERVER_PORT}
    healthcheck:
      test:
        [
          'CMD-SHELL',
          "node -e \"fetch('http://localhost:' + process.env.SERVER_PORT + '/health').then(response => process.exit(response.ok ? 0 : 1)).catch(() => process.exit(1))\""
        ]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 5s

  postgres:
    image: postgres:14
    ports:
      - "${POSTGRES_PORT}:5432"
    healthcheck:
      test:
        [
          'CMD-SHELL',
          "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"
        ]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - ./tmp/pgdata:/var/lib/postgresql/data
